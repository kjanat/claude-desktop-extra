# TESTING-ONLY workflow. Builds the amd64 tarball twice from one verified .deb,
# compares the hashes, attests the result, and publishes a prerelease.
# Delete before upstreaming; the reproducibility work itself lives in:
# scripts/build-patched-tarball.sh.
---
name: Repro & Attest Test

on:
  push: { branches: [repro-attest] }
  workflow_dispatch: null

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: repro-attest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download & GPG/SHA-verify official amd64 .deb
        run: |
          bash .github/scripts/apt-fetch-verify.sh download amd64 deb-input
          ls -la deb-input/

      - name: Upload verified .deb
        uses: actions/upload-artifact@v7
        with:
          name: verified-deb
          path: deb-input/claude-desktop_*_amd64.deb
          retention-days: 1
          compression-level: 0

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy: { fail-fast: false, matrix: { leg: [a, b] } }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified .deb
        uses: actions/download-artifact@v8
        with: { name: verified-deb, path: deb-input }

      - name: Build toolchain image
        run: |
          # Both legs build this from the same Dockerfile within seconds of each
          # other. An Arch package push landing between them would surface as a
          # mismatch, which the tree diff in `compare` then names.
          cat > Dockerfile.repro <<'DOCKERFILE'
          FROM archlinux:base-devel
          RUN pacman -Syu --noconfirm && \
              pacman -S --noconfirm python nodejs npm git imagemagick shellcheck \
                                    nim nimble binutils tar zstd xz gnupg && \
              useradd -m builder && \
              echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          RUN nimble install -y regex
          RUN cd /tmp && git clone https://aur.archlinux.org/yay-bin.git && \
              chown -R builder:builder yay-bin && \
              cd yay-bin && su builder -c 'makepkg -si --noconfirm' && \
              su builder -c 'yay -S --noconfirm asar'
          DOCKERFILE
          docker build -f Dockerfile.repro -t claude-repro:local .

      - name: Build
        run: |
          mkdir -p build-input out
          cp deb-input/claude-desktop_*_amd64.deb build-input/claude.deb
          cp -r scripts patches js packaging build-input/
          docker run --rm \
            -v "${PWD}/build-input:/input:ro" \
            -v "${PWD}/out:/output" \
            claude-repro:local \
            bash -c 'CLAUDE_GPG_VERIFY=0 SKIP_SMOKE_TEST=1 \
              bash /input/scripts/build-patched-tarball.sh /input/claude.deb /output'
          uid="$(id -u)"
          gid="$(id -g)"
          sudo chown -R "${uid}:${gid}" out
          cat out/build-info.txt

      - name: Upload build-info
        uses: actions/upload-artifact@v7
        with:
          name: build-info-${{ matrix.leg }}
          path: out/build-info.txt
          retention-days: 7

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.leg }}
          path: out/claude-desktop-*-linux.tar.gz
          retention-days: 1
          compression-level: 0

  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download build-info A
        uses: actions/download-artifact@v8
        with: { name: build-info-a, path: info-a }

      - name: Download build-info B
        uses: actions/download-artifact@v8
        with: { name: build-info-b, path: info-b }

      - name: Download tarball A
        uses: actions/download-artifact@v8
        with: { name: tarball-a, path: out-a }

      - name: Compare
        id: compare
        run: |
          while IFS='=' read -r k v; do printf -v "A_${k}" '%s' "${v//\"/}"; done < info-a/build-info.txt
          while IFS='=' read -r k v; do printf -v "B_${k}" '%s' "${v//\"/}"; done < info-b/build-info.txt

          cat <<-EOF >> "${GITHUB_OUTPUT}"
          	version=${A_VERSION}
          	sha_a=${A_SHA256}
          	sha_b=${B_SHA256}
          	tar_sha_a=${A_TAR_SHA256}
          	tar_sha_b=${B_TAR_SHA256}
          EOF

          cat <<-EOF
          	epoch A: ${A_SOURCE_DATE_EPOCH}
          	epoch B: ${B_SOURCE_DATE_EPOCH}
          	gz    A: ${A_SHA256}
          	gz    B: ${B_SHA256}
          	tar   A: ${A_TAR_SHA256}
          	tar   B: ${B_TAR_SHA256}
          EOF

          if [[ "${A_SHA256}" == "${B_SHA256}" ]]; then
            echo "reproducible=true" >> "${GITHUB_OUTPUT}"
            echo "REPRODUCIBLE: .tar.gz hashes match"
          else
            echo "reproducible=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::.tar.gz hashes DIFFER"
          fi

          if [[ "${A_TAR_SHA256}" == "${B_TAR_SHA256}" ]]; then
            echo "tar_reproducible=true" >> "${GITHUB_OUTPUT}"
            echo "REPRODUCIBLE: uncompressed tar hashes match"
          else
            echo "tar_reproducible=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::uncompressed tar hashes DIFFER — divergence is in the tree, not the compressor"
          fi

      - name: Download tarball B
        if: steps.compare.outputs.reproducible == 'false'
        uses: actions/download-artifact@v8
        with: { name: tarball-b, path: out-b }

      - name: Diff the two trees
        if: steps.compare.outputs.reproducible == 'false'
        run: |
          # Names the diverging members instead of leaving a bare hash mismatch.
          mkdir -p cmp/a cmp/b
          tar -xzf out-a/claude-desktop-*-linux.tar.gz -C cmp/a
          tar -xzf out-b/claude-desktop-*-linux.tar.gz -C cmp/b
          diff -rq cmp/a cmp/b > tree-diff.txt 2>&1 || true
          echo "=== differing files ==="
          cat tree-diff.txt
          wc -l tree-diff.txt

      - name: Upload tree diff
        if: steps.compare.outputs.reproducible == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: tree-diff
          path: tree-diff.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with: { subject-path: out-a/claude-desktop-*-linux.tar.gz }

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.compare.outputs.version }}
          SHA_A: ${{ steps.compare.outputs.sha_a }}
          SHA_B: ${{ steps.compare.outputs.sha_b }}
          TAR_A: ${{ steps.compare.outputs.tar_sha_a }}
          TAR_B: ${{ steps.compare.outputs.tar_sha_b }}
          REPRO: ${{ steps.compare.outputs.reproducible }}
          TAR_REPRO: ${{ steps.compare.outputs.tar_reproducible }}
          RELEASE_TAG: repro-test-${{ steps.compare.outputs.version }}-${{ github.run_number }}
          RELEASE_NAME: Repro probe ${{ steps.compare.outputs.version }} (run ${{ github.run_number }})
        working-directory: out-a
        run: |
          TARBALL=(claude-desktop-*-linux.tar.gz)
          cat <<EOF | tee -a "${GITHUB_STEP_SUMMARY}" | gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_NAME}" --prerelease \
            --notes-file - "${TARBALL[0]}"
          Reproducibility probe for Claude Desktop ${VERSION}, amd64.

          Two builds on separate runners from one GPG-verified upstream .deb.
          The tarball omits the Rust CU bridges.

          | layer   | build A      | build B      | match        |
          | ------- | ------------ | ------------ | ------------ |
          | .tar.gz | \`${SHA_A}\` | \`${SHA_B}\` | ${REPRO}     |
          | .tar    | \`${TAR_A}\` | \`${TAR_B}\` | ${TAR_REPRO} |

          Verify the attestation:

          \```sh
          gh attestation verify ${TARBALL[0]} --repo ${GITHUB_REPOSITORY}
          \```
          EOF

      - name: Fail if not reproducible
        if: steps.compare.outputs.reproducible == 'false'
        run: echo "::error::Builds are not byte-identical. Prerelease and attestation were still published; see the tree-diff artifact." && exit 1
